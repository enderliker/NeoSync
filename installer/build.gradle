plugins {
    id 'java'
    id 'net.neoforged.licenser'
    id 'neoforge.formatting-conventions'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'net.neoforged:legacyinstaller:3.0.48:shrunk'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation platform("org.junit:junit-bom:${project.jupiter_api_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// The standalone installer has no Minecraft annotation dependency.
tasks.named('generatePackageInfos') { files.setFrom([]) }
tasks.named('test') { useJUnitPlatform() }
license {
    header = rootProject.file('codeformat/INSTALLER_HEADER.txt')
    skipExistingHeaders = true
    include '**/*.java'
}
java { withSourcesJar() }

tasks.register('executableManifest') {
    def manifest = layout.buildDirectory.file('installer-manifest/META-INF/MANIFEST.MF')
    outputs.file(manifest)
    doLast {
        def output = manifest.get().asFile
        output.parentFile.mkdirs()
        output.text = 'Manifest-Version: 1.0\r\nMain-Class: net.neoforged.neosync.installer.InstallerMain\r\n\r\nName: net/minecraftforge/installer/\r\nSpecification-Title: Installer\r\nSpecification-Vendor: NeoForge\r\nSpecification-Version: 3.0\r\nImplementation-Title: SimpleInstaller\r\nImplementation-Version: 3.0.48\r\nImplementation-Vendor: NeoForge\r\n\r\n'
    }
}
