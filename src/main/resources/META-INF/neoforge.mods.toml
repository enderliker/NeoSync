modLoader="javafml"
loaderVersion="[3,]"
issueTrackerURL="https://github.com/enderliker/NeoSync/issues"
logoFile="neosync_logo.png"
license="LGPL v2.1"

[[mods]]
    modId="neoforge"
    # We use the global NeoForge version
    version="${global.neoForgeVersion}"
    #updateJSONURL="https://maven.neoforged.net/releases/net/neoforged/forge/promotions_slim.json"
    displayName="NeoSync"
    credits="Anyone who has contributed on Github and supports our development"
    authors="NeoSync contributors; based on work by The NeoForged Team"
    description='''
    NeoSync helps players prepare the mods required to join a server.
    Based on NeoForge, the broad compatibility API. The version shown here
    identifies the NeoForge base used for mod compatibility.
    '''

[[mixins]]
    config = "neoforge.mixins.json"
