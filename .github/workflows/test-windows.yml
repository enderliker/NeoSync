name: Windows build and test

on:
  push:
    branches: ['1.21.1', 'feature/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/1.21.1' }}

      - name: Prepare Minecraft sources
        run: .\gradlew.bat :neoforge:setup -PvalidateAccessTransformers --max-workers=2 --console=plain

      - name: Build, check formatting, and run unit tests
        run: .\gradlew.bat assemble checkFormatting :installer:test :tests:runUnitTests :neoforge:installerJar --max-workers=2 --console=plain

      - name: Build and verify Windows executable
        run: |
          $installer = @(Get-ChildItem projects/neoforge/build/libs/*-installer.jar)
          if ($installer.Count -ne 1) { throw 'Expected one installer.' }
          ./scripts/build_windows_installer.ps1 -InstallerJar $installer[0].FullName
          $executable = @(Get-ChildItem build/windows-installer/*.exe)[0]
          $report = Join-Path $PWD 'build/windows-installer/check.txt'
          $process = Start-Process -FilePath $executable.FullName -ArgumentList '--wrapper-check', $report -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Windows installer check failed.' }
          Get-Content -LiteralPath $report

      - name: Test installed dedicated server
        run: .\gradlew.bat :neoforge:testProductionServer --max-workers=2 --console=plain

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neosync-windows-${{ github.sha }}
          path: build/windows-installer/*-installer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Store failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-reports-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
