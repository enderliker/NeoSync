name: Check PR local changes

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-local-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/1.21.1' }}

      - name: Setup with Gradle
        run: ./gradlew --max-workers=2 --console=plain :neoforge:setup

      - name: Gen package infos
        run: ./gradlew --max-workers=2 --console=plain generatePackageInfos

      - name: Gen patches
        run: ./gradlew --max-workers=2 --console=plain :neoforge:genPatches

      - name: Run datagen with Gradle
        run: ./gradlew --max-workers=2 --console=plain :neoforge:runData :tests:runData

      - name: Check no local changes are present
        run: |
          # Print status for easier debugging
          git status
          if [ -n "$(git status --porcelain)" ]; then exit 1; fi
