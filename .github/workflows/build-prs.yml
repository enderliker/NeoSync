# Maintained by NeoSync; do not regenerate from the upstream publishing templates.
name: Build and test

on:
  push:
    branches: ['1.21.1', 'feature/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/1.21.1' }}

      - name: Prepare Minecraft sources
        run: ./gradlew :neoforge:setup -PvalidateAccessTransformers --max-workers=2 --console=plain

      - name: Build, check formatting, and run unit tests
        run: ./gradlew assemble checkFormatting :tests:runUnitTests --max-workers=2 --console=plain

      - name: Store failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
