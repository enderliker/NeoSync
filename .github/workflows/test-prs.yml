name: Run PR gametests

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test release credential validation
        run: python3 -m unittest discover -s tests/neosync -p 'test_release_credentials.py'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/1.21.1' }}

      - name: Setup with Gradle
        run: ./gradlew --max-workers=2 --console=plain setup

      - name: Run game tests with Gradle
        run: ./gradlew --max-workers=2 --console=plain :tests:runGameTestServer

      - name: Run JUnit tests with Gradle
        run: ./gradlew --max-workers=2 --console=plain :installer:test :tests:runUnitTests

      - name: Run production client self-test
        run: xvfb-run -a ./gradlew --max-workers=2 --console=plain :neoforge:testProductionClient

      - name: Run production server self-test
        run: ./gradlew --max-workers=2 --console=plain :neoforge:testProductionServer

      - name: Test fixture credential packaging and removal
        run: python3 scripts/check_provider_access_transition.py

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
