name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'enderliker/NeoSync'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew setup checkFormatting :tests:runUnitTests :neoforge:installerJar :neoforge:sourcesJar --max-workers=2 --console=plain

      - name: Test installed server and client
        run: xvfb-run -a ./gradlew :neoforge:testProductionServer :neoforge:testProductionClient --max-workers=2 --console=plain

      - name: Export verified assets
        run: python3 scripts/prepare_release.py

      - name: Upload assets for release review
        uses: actions/upload-artifact@v4
        with:
          name: neosync-release-${{ github.sha }}
          path: build/neosync-release/
          if-no-files-found: error
          retention-days: 14
