name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'enderliker/NeoSync'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare Minecraft sources
        run: ./gradlew setup --max-workers=2 --console=plain

      - name: Build and test
        run: ./gradlew checkFormatting :tests:runUnitTests :neoforge:installerJar :neoforge:sourcesJar --max-workers=2 --console=plain

      - name: Test installed server and client
        run: xvfb-run -a ./gradlew :neoforge:testProductionServer :neoforge:testProductionClient --max-workers=2 --console=plain

      - name: Export verified assets
        run: python3 scripts/prepare_release.py

      - name: Upload assets for release review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neosync-release-${{ github.sha }}
          path: build/neosync-release/
          if-no-files-found: error
          retention-days: 14
